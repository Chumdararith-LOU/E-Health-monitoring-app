info:
  name: summary own
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/patients/{{patientId}}/summary?days=30"
  params:
    - name: days
      value: "30"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
