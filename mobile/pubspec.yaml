name: ehealth_mobile
description: "E-Health Monitoring App — mobile front-end with demo data stored on the phone (no backend yet)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Part of the Flutter SDK. Gives Khmer + English strings to the built-in
  # date and time pickers.
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.4
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans_400Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSans_500Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GoogleSans_700Bold.ttf
          weight: 700
    - family: NotoSansKhmer
      fonts:
        - asset: assets/fonts/NotoSansKhmer_400Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansKhmer_500Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansKhmer_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansKhmer_700Bold.ttf
          weight: 700
    - family: MaterialDesignIcons
      fonts:
        - asset: assets/fonts/MaterialDesignIcons.ttf

# App icon from the design (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: assets/icon/android-icon-background.png
  adaptive_icon_foreground: assets/icon/android-icon-foreground.png
  adaptive_icon_monochrome: assets/icon/android-icon-monochrome.png
  # the design already has the safe-zone padding built in
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#0B5CAB"
