# Railway deployment config (uses root Dockerfile + /api/v1/health check).
# Add a persistent Volume mounted at /data and set JWT_SECRET + SEED_DEMO=true in Railway variables.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
