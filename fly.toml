# Fly.io deployment config (region: sin = Singapore, closest to Phnom Penh).
# First time: fly volumes create ehealth_data --region sin --size 1
# Set secret: fly secrets set JWT_SECRET="$(openssl rand -hex 32)"
# Deploy:     fly deploy

app = "ehealth-monitoring-app"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DB_FILE = "/data/ehealth.db"
  WEB_DIST_DIR = "/app/web/dist"
  SEED_DEMO = "true"

[mounts]
  source = "ehealth_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/v1/health"
