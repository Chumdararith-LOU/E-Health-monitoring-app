openapi: 3.1.0
info:
  title: E-Health Monitoring API
  version: 0.1.0
  description: |
    Contract between the API and the web and mobile apps.
    Each module owns one file in this folder; this root file only lists the paths.
    Errors never contain text: `messageKey` is an i18n key the apps translate.
    Days are calendar days in Asia/Phnom_Penh.
servers:
  - url: http://localhost:3000/api/v1
    description: Local API (pnpm --filter @ehealth/api dev)
security:
  - bearerAuth: []
paths:
  # platform – Rith
  /health:
    $ref: './platform.yaml#/health'
  /dev/login:
    $ref: './platform.yaml#/devLogin'

  # reports – Rith
  /patients/{patientId}/summary:
    $ref: './reports.yaml#/summary'
  /patients/{patientId}/series:
    $ref: './reports.yaml#/series'

  # accounts – Phayuk
  /auth/register:
    $ref: './accounts.yaml#/register'
  /auth/login:
    $ref: './accounts.yaml#/login'
  /auth/me:
    $ref: './accounts.yaml#/me'
  /auth/verify-email/send:
    $ref: './accounts.yaml#/verifyEmailSend'
  /auth/verify-email/confirm:
    $ref: './accounts.yaml#/verifyEmailConfirm'

  # readings – Seyla
  /patients/{patientId}/readings:
    $ref: './readings.yaml#/patientReadings'
  /patients/{patientId}/readings/{readingId}:
    $ref: './readings.yaml#/patientReadingById'
  /fields:
    $ref: './readings.yaml#/fields'
  /fields/{fieldId}:
    $ref: './readings.yaml#/fieldById'
  # ocr – Phak: add one line per path here, pointing to ./ocr.yaml
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
